name: Release Readiness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify package release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Verify workspace
        run: pnpm verify

      - name: Verify vectra contract imports
        run: pnpm test:contract

      - name: Lint package exports (publint, attw)
        run: pnpm --filter @cp949/vectra lint:package

      - name: Check npm package contents
        working-directory: sub/vectra
        run: npm pack --dry-run
